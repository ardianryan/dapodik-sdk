version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cron: "0 7 28 * *"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cron: "0 7 28 * *"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
